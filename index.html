<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>סימולטור חובשים גדוד 101 — V3.1</title><style>
:root{--bg:#eef2f3;--card:#fff;--ink:#172126;--muted:#64727a;--line:#d8e0e3;--accent:#164e63;--soft:#e8f1f4;--warn:#fff4dc}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink);direction:rtl}
button{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;background:#f7f9fa}
header{position:sticky;top:0;z-index:5;background:#17323d;color:white;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800}.clock{font-size:22px;font-weight:900;direction:ltr}
main{padding:14px}.screen{display:none}.screen.active{display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #0000000a}
h1,h2,h3{margin:0 0 10px}.muted{color:var(--muted);font-size:14px}.status{line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cardbtn{min-height:74px;border:1px solid #c9d5d9;border-radius:14px;background:white;padding:12px;font-weight:800;color:#18313a}
.cardbtn:active{transform:scale(.98);background:var(--soft)}.cardbtn.primary{background:#17323d;color:white}
.cardbtn[disabled]{opacity:.4}.wide{grid-column:1/-1}.back{background:none;border:0;color:var(--accent);font-weight:800;padding:8px 0}
.log{max-height:265px;overflow:auto}.entry{border-bottom:1px solid #edf0f1;padding:9px 0;line-height:1.45}.t{font-weight:900;margin-left:8px;direction:ltr;display:inline-block}
.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{background:var(--soft);border-radius:999px;padding:6px 9px;font-size:13px}
.notice{background:var(--warn);padding:10px;border-radius:12px;line-height:1.45}
.modal{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end}.modal.hidden{display:none}.sheet{background:white;width:100%;max-width:760px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:80vh;overflow:auto}
.score{font-size:54px;font-weight:900;text-align:center}.small{font-size:13px}.sectionTitle{font-size:15px;color:var(--muted);margin:14px 0 8px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.modal{align-items:center}.sheet{border-radius:20px;max-width:650px}}
</style></head><body>
<div class="app">
<header><div><div class="brand">סימולטור חובשים גדוד 101</div><div class="small" id="phase">V3.1</div></div><div class="clock" id="clock">00:00</div></header>
<main>
<section id="home" class="screen active">
 <div class="panel"><h1>V3.1 — סימולטור החלטות</h1><p class="status">הצ׳אט הוחלף בכרטיסיות פעולה. הכרטיסיות מבוססות על המידע הגלוי לחובש ועל שלב התרחיש.</p></div>
 <div class="grid"><button id="team" class="cardbtn primary">חובש צוותי</button><button id="tagad" class="cardbtn primary">חובש תאג״ד</button></div>
</section>
<section id="sim" class="screen">
 <div class="panel"><div id="eta" class="muted"></div><h3>תמונת מצב</h3><div id="picture" class="status"></div><div id="known" class="tags" style="margin-top:10px"></div></div>
 <div class="panel"><h3>מה אתה עושה?</h3><div id="cards" class="grid"></div></div>
 <div class="panel"><h3>יומן תרחיש</h3><div id="log" class="log"></div></div>
</section>
<section id="debrief" class="screen">
 <div class="panel"><h2>תחקיר</h2><div class="score" id="score">0</div><div class="muted" style="text-align:center">מתוך 100 — אב־טיפוס לניקוד</div></div>
 <div class="panel"><h3>נקודות מרכזיות</h3><div id="review"></div></div>
 <div class="grid"><button id="again" class="cardbtn primary">תרחיש אקראי נוסף</button><button id="homeBtn" class="cardbtn">מסך ראשי</button></div>
</section>
</main></div>
<div id="modal" class="modal hidden"><div class="sheet"><button id="closeSheet" class="back">← חזרה</button><h3 id="sheetTitle"></h3><div id="sheetGrid" class="grid"></div></div></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.round(s%60)).padStart(2,'0')}`,pick=a=>a[Math.floor(Math.random()*a.length)],chance=p=>Math.random()<p;
let S=null,recent=[];
const mechs=['ירי','פיצוץ ורסיסים','נפילה מגובה','תאונת דרכים / התהפכות','קריסה / מעיכה','דקירה'];
const pool=[
['ירך ימין','limb',1],['ירך שמאל','limb',1],['שוק ימין','limb',1],['שוק שמאל','limb',1],['אמה ימין','limb',1],['אמה שמאל','limb',1],
['מפשעה ימין','junction',1],['מפשעה שמאל','junction',1],['בית שחי ימין','junction',1],['בית שחי שמאל','junction',1],
['חזה ימין','chest',1],['חזה שמאל','chest',1],['בטן ימין','abdomen',1],['בטן שמאל','abdomen',1],
['גב עליון ימין','back',0],['גב עליון שמאל','back',0],['גב תחתון','back',0]
];
function scenario(role){
 for(let z=0;z<50;z++){
  let mech=pick(mechs),n=1+Math.floor(Math.random()*3),chosen=[];
  while(chosen.length<n){let w=pick(pool);if(!chosen.some(x=>x[0]===w[0]))chosen.push(w)}
  let wounds=chosen.map((w,i)=>({id:'w'+i,place:w[0],zone:w[1],front:!!w[2],bleeding:chance(['chest','abdomen','back'].includes(w[1])?.55:.88),known:false,packingStage:0}));
  if(!wounds.some(w=>w.bleeding))wounds[0].bleeding=true;
  wounds.filter(w=>w.front&&w.bleeding&&chance(.7)).forEach(w=>w.known=true);
  let soldiers=Math.floor(Math.random()*3),sig=[mech,chosen.map(x=>x[1]).sort().join(','),wounds.filter(w=>w.known).map(x=>x.zone).join(','),soldiers].join('|');
  if(!recent.includes(sig)){recent.push(sig);recent=recent.slice(-5);return {mech,wounds,soldiers,shock:1.4+Math.random()*2.4,resp:1.4+(wounds.some(w=>w.zone==='chest')?.9:0)+Math.random()*.7,join:390+Math.floor(Math.random()*330),travel:240+Math.floor(Math.random()*360)}}
 }
}
function start(role){
 let x=scenario(role);
 S={role,time:0,mech:x.mech,wounds:x.wounds,shock:x.shock,resp:x.resp,join:x.join,travel:x.travel,location:role==='team'?'שטח':'נאפ״ל',phase:role==='team'?'שטח':'נאפ״ל',loaded:false,arrived:false,conscious:x.shock<4.8,exposed:false,covered:false,onStretcher:false,iv:0,lastVitals:null,requests:[],paramedic:[],actions:[],ended:false,inv:{tq:2,packing:3,bandage:3,iv:2,blanket:1,stretcher:1},soldiers:Array.from({length:x.soldiers},(_,i)=>({id:i+1,busy:false,task:'',until:0}))};
 show('sim');let v=S.wounds.filter(w=>w.known&&w.bleeding);log(`מנגנון: ${S.mech}. ${v.length?'דימום נראה: '+v.map(w=>w.place).join(', ')+'.':'לא נראה דימום חיצוני משמעותי מיד.'} ${S.conscious?'הפצוע בהכרה ומגיב.':'הפצוע אינו בהכרה.'}`);render()
}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active')}
function log(t){S.actions.push({t:S.time,txt:t});$('#log').innerHTML=S.actions.map(e=>`<div class="entry"><span class="t">${fmt(e.t)}</span>${e.txt}</div>`).join('');$('#log').scrollTop=99999}
function bleeds(){return S.wounds.filter(w=>w.bleeding).length}
function dur(b){return S.role==='tagad'&&S.loaded&&!S.arrived?b+15:b}
function evolve(sec){
 S.shock+=bleeds()*.20*(sec/60);if(S.wounds.some(w=>w.zone==='chest'&&w.bleeding))S.resp+=.09*(sec/60);if(S.shock>5.3)S.conscious=false;S.time+=sec;
 S.soldiers.forEach(x=>{if(x.busy&&S.time>=x.until){x.busy=false;x.task=''}});
 if(S.role==='team'&&S.time>=S.join&&!S.ended){S.time=S.join;return end('התאג״ד חבר אליכם והפצוע הועבר להמשך טיפול.')}
 if(S.role==='tagad'&&S.loaded&&!S.arrived){S.travel-=sec;if(S.travel<=0){S.arrived=true;S.location='מנחת';S.phase='מנחת';log('הגעתם למנחת. ניתן להמשיך טיפול עד הפינוי.')}}
}
function obs(){
 let a=[S.conscious?'הפצוע בהכרה ומגיב.':'הפצוע אינו בהכרה.'];if(S.resp>3.4)a.push('הנשימה נראית מאומצת ומהירה.');else if(S.resp>2)a.push('הנשימה נראית מהירה.');
 let k=S.wounds.filter(w=>w.known&&w.bleeding);if(k.length)a.push('דימום פעיל: '+k.map(w=>w.place).join(', ')+'.');let c=S.wounds.filter(w=>w.known&&!w.bleeding);if(c.length)a.push('דימום שנעצר: '+c.map(w=>w.place).join(', ')+'.');
 if(S.covered)a.push('הפצוע מכוסה.');if(S.onStretcher)a.push('הפצוע על אלונקה.');return a.join(' ')
}
function render(){
 $('#clock').textContent=fmt(S.time);$('#phase').textContent=S.phase;$('#picture').textContent=obs();$('#known').innerHTML=S.wounds.filter(w=>w.known).map(w=>`<span class="tag">${w.place}: ${w.bleeding?'דימום פעיל':'דימום נעצר'}</span>`).join('');
 $('#eta').textContent=S.role==='team'?`חבירת תאג״ד בעוד ${fmt(Math.max(0,S.join-S.time))}`:!S.loaded?'תאג״ד — טיפול בנאפ״ל':!S.arrived?`בנסיעה למנחת — ${fmt(Math.max(0,S.travel))} להגעה`:'מנחת';
 cards()
}
function cards(){
 let b=$('#cards');b.innerHTML='';const add=(t,f)=>{let x=document.createElement('button');x.className='cardbtn';x.textContent=t;x.onclick=f;b.appendChild(x)};
 if(S.wounds.some(w=>w.known&&w.bleeding))add('🩸 עצירת דימום',bleedMenu);add('👕 הפשטה וסריקה',expose);add('🫀 מדדים',vitalsMenu);
 if(S.role==='team'&&S.location==='שטח')add('🚑 גרירה לנאפ״ל',()=>act(70,'הפצוע הועבר לנאפ״ל.',()=>{S.location='נאפ״ל';S.phase='נאפ״ל'}));
 if(S.location==='נאפ״ל')add('🛏️ מנח פצוע',posMenu);
 add('🛡️ כיסוי',cover);add('🛏️ אלונקה',stretcher);if(S.location!=='שטח')add('💉 פתיחת וריד',openIV);
 if(S.role==='team')add('📡 בקשות מהתאג״ד',requestMenu);
 if(S.role==='tagad'){add('👨‍⚕️ בקשה מהפרמדיק',paramedicMenu);if(!S.loaded)add('🚐 העמסה לכלי פינוי',load)}
 if(S.soldiers.length)add('🧑‍🤝‍🧑 לוחם',soldierMenu);add('⏱️ המתנה',waitMenu)
}
function sheet(t,items){$('#sheetTitle').textContent=t;let g=$('#sheetGrid');g.innerHTML='';items.forEach(([l,f,d])=>{let b=document.createElement('button');b.className='cardbtn';b.textContent=l;b.disabled=!!d;b.onclick=()=>{close();f()};g.appendChild(b)});$('#modal').classList.remove('hidden')}
function close(){$('#modal').classList.add('hidden')}
function act(base,text,after,fixed=false){evolve(fixed?base:dur(base));if(S.ended)return;if(after)after();log(text);log('תמונת מצב: '+obs());render()}
function bleedMenu(){sheet('באיזה דימום לטפל?',S.wounds.filter(w=>w.known&&w.bleeding).map(w=>[w.place,()=>methods(w)]))}
function methods(w){sheet(`עצירת דימום — ${w.place}`,[`חוסם עורקים (${S.inv.tq})`,()=>hemo(w,'tq'),S.inv.tq<1],)}
function methods(w){sheet(`עצירת דימום — ${w.place}`,[
 [`חוסם עורקים (${S.inv.tq})`,()=>hemo(w,'tq'),S.inv.tq<1],
 [`פקינג (${S.inv.packing})`,()=>packing(w),S.inv.packing<1&&w.packingStage===0],
 [`תחבושת אישית (${S.inv.bandage})`,()=>hemo(w,'bandage'),S.inv.bandage<1]
])}
function hemo(w,m){S.inv[m]--;let ok=w.zone==='limb'&&m==='tq';act(m==='tq'?15:30,`${m==='tq'?'חוסם עורקים':'תחבושת אישית'} בוצע על ${w.place}. ${ok?'הדימום נעצר.':'הדימום עדיין פעיל.'}`,()=>{if(ok)w.bleeding=false})}
function packing(w){
 if(w.packingStage===0){S.inv.packing--;act(30,`תחבושת הוכנסה לפצע ב${w.place}. נדרש כעת לחץ ישיר.`,()=>w.packingStage=1)}
 else if(w.packingStage===1){let free=S.soldiers.find(x=>!x.busy),o=[['החובש מבצע לחץ ישיר 3 דקות',()=>act(180,`בוצעו 3 דקות לחץ ישיר על ${w.place}.`,()=>w.packingStage=2,true)]];if(free)o.push(['העבר לחץ ישיר ללוחם',()=>{free.busy=true;free.task=`לחץ ישיר על ${w.place}`;free.until=S.time+180;w.packingStage=2;log(`לוחם ${free.id} מבצע לחץ ישיר למשך 3 דקות.`);render()}]);sheet('פקינג — לחץ ישיר',o)}
 else if(w.packingStage===2){if(S.inv.bandage<1)return log('אין תחבושת לכיסוי.');S.inv.bandage--;let ok=w.zone==='junction';act(30,`הפקינג כוסה בתחבושת. ${ok?'הדימום נעצר.':'הדימום עדיין פעיל.'}`,()=>{w.packingStage=3;if(ok)w.bleeding=false})}
}
function expose(){if(S.exposed)return log('הפצוע כבר הופשט ונסרק.');act(45,'בוצעה הפשטה מלאה וסריקת דימומים.',()=>{S.exposed=true;S.wounds.forEach(w=>w.known=true)})}
function vitalsMenu(){let x=[['לקיחת מדדים מלאה',()=>vitals('all')],['דופק',()=>vitals('pulse')],['סטורציה',()=>vitals('spo2')],['איכות נשימה',()=>vitals('resp')],['הכרה',()=>vitals('con')]];if(S.role==='tagad')x.splice(3,0,['לחץ דם',()=>vitals('bp')]);sheet('מדדים',x)}
function vals(){let p=Math.min(165,Math.round(82+S.shock*12)),sp=Math.max(78,Math.round(98-S.resp*2)),sys=Math.max(65,Math.round(124-S.shock*10));return{pulse:`${p} לדקה, ${S.shock>=4?'רדיאלי לא נימוש':S.shock>=2.7?'רדיאלי חלש':'רדיאלי נימוש'}`,spo:`${sp}%`,bp:`${sys}/${Math.max(40,Math.round(sys*.62))}`,resp:S.resp>3.4?'מהירה ושטחית עם מאמץ':'מהירה, ללא מאמץ בולט',con:S.conscious?'בהכרה ומגיב':'לא בהכרה'}}
function vitals(k){let v=vals(),m={pulse:'דופק',spo:'סטורציה',bp:'לחץ דם',resp:'נשימה',con:'הכרה'};if(k==='all'){let t=`דופק: ${v.pulse} | סטורציה: ${v.spo} | ${S.role==='tagad'?`ל״ד: ${v.bp} | `:''}נשימה: ${v.resp} | הכרה: ${v.con}`;S.lastVitals=v;act(S.role==='tagad'?45:35,t)}else act(k==='bp'?30:12,`${m[k]}: ${v[k]}`)}
function posMenu(){sheet('מנח פצוע',[['ישיבה',()=>pos('ישיבה')],['שכיבה',()=>pos('שכיבה')],['חש״י',()=>pos('חש״י')]])}
function pos(p){if(p==='ישיבה'&&!S.conscious)return act(8,'הפצוע אינו מסוגל לשמור על ישיבה עצמאית.');act(10,`הפצוע הועבר למנח ${p}.`,()=>{})}
function cover(){if(S.covered)return log('הפצוע כבר מכוסה.');if(S.inv.blanket<1)return log('אין כיסוי זמין.');S.inv.blanket--;act(20,'הפצוע כוסה.',()=>S.covered=true)}
function stretcher(){if(S.onStretcher)return log('הפצוע כבר על אלונקה.');act(35,'הפצוע הועבר לאלונקה.',()=>S.onStretcher=true)}
function openIV(){if(S.inv.iv<1)return log('אין ערכה נוספת לפתיחת וריד.');if(S.iv>=2)return log('כבר קיימות שתי גישות ורידיות.');S.inv.iv--;act(45,`הושגה גישה ורידית. סה״כ גישות: ${S.iv+1}.`,()=>S.iv++)}
function requestMenu(){sheet('בקשות מהתאג״ד',[['חמצן',()=>req('חמצן')],['דם / פלזמה',()=>req('דם / פלזמה')],['אינטובציה',()=>req('אינטובציה')],['קוניוטומיה',()=>req('קוניוטומיה')]])}
function req(x){act(8,`בקשה ל${x} הועברה לתאג״ד.`,()=>S.requests.push(x))}
function paramedicMenu(){sheet('בקשה מהפרמדיק',[['חמצן',()=>preq('חמצן')],['דם / פלזמה',()=>preq('דם / פלזמה')],['אינטובציה',()=>preq('אינטובציה')],['קוניוטומיה',()=>preq('קוניוטומיה')]])}
function preq(x){act(8,`הועברה לפרמדיק בקשה: ${x}.`,()=>S.paramedic.push(x))}
function load(){if(!S.onStretcher)return log('העמסה לכלי פינוי דורשת קודם אלונקה.');act(60,'הפצוע הועמס לכלי הפינוי והנסיעה למנחת החלה.',()=>{S.loaded=true;S.location='כלי פינוי';S.phase='נסיעה'})}
function soldierMenu(){let free=S.soldiers.find(x=>!x.busy);if(!free)return log('אין כרגע לוחם פנוי.');sheet('לוחם מסייע',[['לדבר עם הפצוע ולהעסיק אותו',()=>{free.busy=true;free.task='מדבר עם הפצוע';free.until=S.time+180;log(`לוחם ${free.id} נשאר לצד הפצוע ומדבר איתו.`);render()}]])}
function waitMenu(){let x=[['30 שניות',()=>wait(30)],['דקה',()=>wait(60)]];if(S.role==='team')x.push(['עד חבירת התאג״ד',()=>wait(Math.max(0,S.join-S.time))]);if(S.role==='tagad'&&S.loaded&&!S.arrived)x.push(['עד הגעה למנחת',()=>wait(Math.max(0,S.travel))]);sheet('המתנה',x)}
function band(){return(S.conscious?0:3)+(S.resp>3.4?2:0)+(bleeds()?1:0)}
function wait(total){let p=0,o=band();while(p<total&&!S.ended){let d=Math.min(15,total-p);evolve(d);p+=d;if(S.ended)return;if(band()>o){log(`ההמתנה נעצרה לאחר ${fmt(p)} עקב שינוי נראה לעין במצב הפצוע.`);log('תמונת מצב: '+obs());render();return}}log(`המתנה של ${fmt(total)} הסתיימה.`);log('תמונת מצב: '+obs());render()}
function end(r){S.ended=true;log(r);render();setTimeout(debrief,80)}
function debrief(){show('debrief');let c=S.wounds.filter(w=>['limb','junction'].includes(w.zone)).every(w=>!w.bleeding),score=70+(c?12:-15)+(S.exposed?6:0)+(S.lastVitals?5:0);if(S.shock>=4)score+=S.iv>=2?5:-5;score=Math.max(0,Math.min(100,score));$('#score').textContent=score;let n=[c?'מקורות הדימום שניתנים לשליטה טופלו.':'נשאר מקור דימום שניתן היה לטפל בו.',S.exposed?'בוצעה הפשטה וסריקה.':'לא בוצעה הפשטה וסריקה מלאה.'];if(S.role==='tagad')n.push(S.loaded?`בוצעה העמסה; שלב נוכחי: ${S.arrived?'מנחת':'נסיעה'}.`:'לא בוצעה העמסה לכלי פינוי.');$('#review').innerHTML=n.map(x=>`<div class="entry">${x}</div>`).join('')}
$('#team').onclick=()=>start('team');$('#tagad').onclick=()=>start('tagad');$('#closeSheet').onclick=close;$('#again').onclick=()=>start(S.role);$('#homeBtn').onclick=()=>{S=null;show('home')};
})();
</script></body></html>
